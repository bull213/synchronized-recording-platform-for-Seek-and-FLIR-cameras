name: Recorder checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recorder:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install source dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Check installed requirements
        run: python -m pip check
      - name: Run recorder tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Run synthetic recording self-test
        run: python launch_sync.py --self-test
      - name: Check the source manifest
        run: python scripts/package_source.py --check
